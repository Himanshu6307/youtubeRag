authors = [
    { name = "Himanshu6307", email = "mathematicsking123r@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
